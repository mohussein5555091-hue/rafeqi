<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-7e596db5-da4a-4ef0-b72d-0bcd074549d9/styles.css">
<link rel="stylesheet" href="rafeqi.css">
<script src="icons.js"></script>
</helmet>
<aside style="width:248px;flex:none;align-self:stretch;height:100%;min-height:100%;display:flex;flex-direction:column;gap:22px;padding:24px 16px;background:var(--color-surface);color:var(--color-text)">
  <div style="display:flex;align-items:center;gap:10px;padding:0 8px">
    <span style="width:38px;height:38px;border-radius:50%;background:var(--color-accent);color:var(--color-bg);display:grid;place-items:center;font-family:var(--font-heading);font-size:20px">{{ mark }}</span>
    <span style="font-family:var(--font-heading);font-size:22px">{{ brand }}</span>
  </div>
  <nav style="display:flex;flex-direction:column;gap:4px">
    <sc-for list="{{ items }}" as="t" hint-placeholder-count="9">
      <a href="#" aria-current="{{ t.current }}" style="{{ t.style }}">
        <r-icon name="{{ t.icon }}" size="20"></r-icon>
        <span style="flex:1;white-space:nowrap">{{ t.label }}</span>
        <sc-if value="{{ t.badge }}" hint-placeholder-val="{{ false }}"><span class="tag" style="background:var(--color-accent);color:var(--color-bg);font-weight:700">{{ dueLabel }}</span></sc-if>
      </a>
    </sc-for>
  </nav>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;gap:8px">
      <button class="btn btn-secondary" style="flex:1;height:44px;font-family:var(--font-body);font-weight:600">{{ langSwitch }}</button>
      <button class="btn btn-secondary" aria-label="Theme" style="width:44px;height:44px;padding:0"><r-icon name="moon" size="18"></r-icon></button>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:8px;border-radius:999px;background:var(--color-bg)">
      <span style="width:40px;height:40px;border-radius:50%;background:var(--color-accent-2-200);color:var(--color-accent-2-800);display:grid;place-items:center;font-family:var(--font-heading);font-size:17px">{{ initial }}</span>
      <span style="display:flex;flex-direction:column;line-height:1.25"><strong style="font-size:14px">{{ name }}</strong><span style="font-size:12px;color:var(--color-neutral-700)">{{ meta }}</span></span>
    </div>
    <p style="margin:0;font-size:11.5px;line-height:1.45;color:var(--color-neutral-700);padding:0 8px">{{ disclaimer }}</p>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:248,&quot;height&quot;:900},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;workouts&quot;,&quot;nutrition&quot;,&quot;groceries&quot;,&quot;progress&quot;,&quot;checkin&quot;,&quot;reviews&quot;,&quot;injuries&quot;,&quot;profile&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;'en'|'ar'&quot;},&quot;due&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const ar = this.props.lang === 'ar', active = this.props.active ?? 'home', due = !!this.props.due;
    const I = [
      ['home', 'house', 'Home', 'الرئيسية'], ['workouts', 'dumbbell', 'Workouts', 'التمارين'],
      ['nutrition', 'salad', 'Nutrition', 'التغذية'], ['groceries', 'shopping-basket', 'Groceries', 'المشتريات'],
      ['progress', 'chart-line', 'Progress', 'التقدم'], ['checkin', 'clipboard-check', 'Check-in', 'المتابعة'],
      ['reviews', 'notebook-pen', 'Weekly reviews', 'المراجعات الأسبوعية'], ['injuries', 'bandage', 'Injuries', 'الإصابات'],
      ['profile', 'settings', 'Profile & settings', 'الحساب والإعدادات']];
    return {
      mark: ar ? 'ر' : 'R', brand: ar ? 'رفيقي' : 'Rafeqi', initial: ar ? 'ع' : 'O',
      name: ar ? 'عمر حسن' : 'Omar Hassan', meta: ar ? 'متوسط · 4 أيام في الأسبوع' : 'Intermediate · 4 days/week',
      langSwitch: ar ? 'English' : 'عربي', dueLabel: ar ? 'مستحقة' : 'Due',
      disclaimer: ar ? 'رفيقي يقدّم إرشادات لياقة عامة وليس نصيحة طبية.' : 'Rafeqi gives general fitness guidance and is not medical advice.',
      items: I.map(([k, icon, en, a]) => {
        const on = k === active;
        return { icon, label: ar ? a : en, current: on ? 'page' : 'false', badge: k === 'checkin' && due,
          style: { display: 'flex', alignItems: 'center', gap: 12, minHeight: 44, padding: '0 14px', borderRadius: 999, textDecoration: 'none', fontSize: 14.5, fontWeight: on ? 700 : 500, color: on ? 'var(--color-accent-800)' : 'var(--color-text)', background: on ? 'var(--color-accent-200)' : 'transparent' } };
      })
    };
  }
}
</script>
</body>
</html>
