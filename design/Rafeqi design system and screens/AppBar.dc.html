<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-7e596db5-da4a-4ef0-b72d-0bcd074549d9/styles.css">
<link rel="stylesheet" href="rafeqi.css">
<script src="_ds/organic-7e596db5-da4a-4ef0-b72d-0bcd074549d9/_ds_bundle.js"></script>
<script src="icons.js"></script>
</helmet>
<div style="flex:none;display:flex;flex-direction:column;background:var(--color-bg);color:var(--color-text)">
  <div dir="ltr" style="height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600;font-family:system-ui,sans-serif">
    <span>9:41</span>
    <span style="display:flex;gap:6px;align-items:center"><r-icon name="signal" size="15" stroke="2.5"></r-icon><r-icon name="wifi" size="15" stroke="2.5"></r-icon><r-icon name="battery-full" size="18" stroke="2"></r-icon></span>
  </div>
  <div style="display:flex;align-items:center;gap:10px;padding:6px 16px 10px;min-height:56px">
    <sc-if value="{{ back }}" hint-placeholder-val="{{ false }}">
      <button class="btn btn-secondary" aria-label="{{ backLabel }}" style="width:44px;height:44px;padding:0;flex:none"><r-icon name="arrow-left" size="20" flip=""></r-icon></button>
    </sc-if>
    <sc-if value="{{ brand }}" hint-placeholder-val="{{ false }}">
      <span style="width:34px;height:34px;border-radius:50%;background:var(--color-accent);color:var(--color-bg);display:grid;place-items:center;font-family:var(--font-heading);font-size:18px;flex:none">{{ mark }}</span>
    </sc-if>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column">
      <span style="font-family:var(--font-heading);font-size:21px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ title }}</span>
      <sc-if value="{{ sub }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:var(--color-neutral-700)">{{ sub }}</span></sc-if>
    </div>
    <button class="btn btn-secondary" aria-label="{{ langLabel }}" style="height:44px;min-width:44px;padding:0 12px;font-family:var(--font-body);font-weight:600;font-size:13px;flex:none">{{ langSwitch }}</button>
    <sc-if value="{{ avatar }}" hint-placeholder-val="{{ true }}">
      <button aria-label="{{ profileLabel }}" style="width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;background:var(--color-accent-2-200);color:var(--color-accent-2-800);font-family:var(--font-heading);font-size:17px;flex:none">{{ initial }}</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:110},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Rafeqi&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;back&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;brand&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;avatar&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;'en'|'ar'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, ar = p.lang === 'ar';
    return {
      title: p.title ?? 'Rafeqi', sub: p.sub ?? '', back: !!p.back, brand: !!p.brand,
      avatar: p.avatar ?? true, mark: ar ? 'ر' : 'R', initial: ar ? 'ع' : 'O',
      langSwitch: ar ? 'EN' : 'عربي', langLabel: ar ? 'Switch to English' : 'التبديل إلى العربية',
      backLabel: ar ? 'رجوع' : 'Back', profileLabel: ar ? 'الملف الشخصي' : 'Profile'
    };
  }
}
</script>
</body>
</html>
