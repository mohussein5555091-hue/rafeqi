<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-7e596db5-da4a-4ef0-b72d-0bcd074549d9/styles.css">
<link rel="stylesheet" href="rafeqi.css">
<script src="icons.js"></script>
</helmet>
<nav style="flex:none;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px 22px;background:var(--color-surface);border-top:1px solid var(--color-divider)">
  <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
    <a href="#" aria-current="{{ t.current }}" style="{{ t.style }}">
      <span style="{{ t.pill }}"><r-icon name="{{ t.icon }}" size="21"></r-icon>
        <sc-if value="{{ t.badge }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:2px;inset-inline-end:10px;width:10px;height:10px;border-radius:50%;background:var(--color-accent);border:2px solid var(--color-surface)"></span></sc-if>
      </span>
      <span>{{ t.label }}</span>
    </a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;workouts&quot;,&quot;nutrition&quot;,&quot;groceries&quot;,&quot;progress&quot;,&quot;none&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;'en'|'ar'&quot;},&quot;due&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const ar = this.props.lang === 'ar', active = this.props.active ?? 'home', due = !!this.props.due;
    const T = [
      ['home', 'house', 'Home', 'الرئيسية'], ['workouts', 'dumbbell', 'Workouts', 'التمارين'],
      ['nutrition', 'salad', 'Nutrition', 'التغذية'], ['groceries', 'shopping-basket', 'Groceries', 'المشتريات'],
      ['progress', 'chart-line', 'Progress', 'التقدم']];
    return {
      tabs: T.map(([k, icon, en, a]) => {
        const on = k === active;
        return {
          icon, label: ar ? a : en, current: on ? 'page' : 'false', badge: k === 'home' && due,
          style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3, minHeight: 52, textDecoration: 'none', fontSize: 11.5, fontWeight: on ? 700 : 500, color: on ? 'var(--color-accent-700)' : 'var(--color-neutral-700)' },
          pill: { position: 'relative', display: 'grid', placeItems: 'center', width: 58, height: 30, borderRadius: 999, background: on ? 'var(--color-accent-200)' : 'transparent' }
        };
      })
    };
  }
}
</script>
</body>
</html>
