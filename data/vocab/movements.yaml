# Controlled vocabulary for movement and joint tags.
#
# Every tag used on an exercise (movement_pattern, joints_loaded, range_of_motion, equipment)
# and on an injury (painful_movements, restrictions) must be an id from this file.
# The backend checks this when saving an injury and when loading the exercise catalogue,
# and the tests check that the frontend's option lists (frontend/src/constants.ts) only use these ids.
#
# To add a tag: add it here with English and Arabic labels. Ids are camelCase and never change once used.
version: 1

# What kind of movement an exercise is. Each exercise has exactly one.
# Substitutions stay within the same pattern.
movement_patterns:
  horizontalPush:           { en: Horizontal push, ar: دفع أفقي }
  verticalPush:             { en: Vertical push, ar: دفع رأسي }
  dip:                      { en: Dip, ar: ديبس }
  horizontalPull:           { en: Horizontal pull, ar: سحب أفقي }
  verticalPull:             { en: Vertical pull, ar: سحب رأسي }
  squat:                    { en: Squat, ar: سكوات }
  hinge:                    { en: Hip hinge, ar: ثني الوسط }
  lunge:                    { en: Lunge / single leg, ar: طعنة / رجل واحدة }
  carry:                    { en: Carry, ar: حمل ومشي }
  core:                     { en: Core, ar: عضلات البطن والجذع }
  elbowFlexion:             { en: Elbow bend (curls), ar: ثني الكوع }
  elbowExtension:           { en: Elbow straighten (triceps), ar: فرد الكوع }
  shoulderAbduction:        { en: Arm raise to the side, ar: رفع الدراع للجنب }
  shoulderExternalRotation: { en: Shoulder outward rotation, ar: لف الكتف لبرّه }
  kneeExtension:            { en: Knee straighten, ar: فرد الركبة }
  kneeFlexion:              { en: Knee bend (hamstrings), ar: ثني الركبة }
  hipAbduction:             { en: Leg out to the side (side glutes), ar: فتح الرجل للجنب }
  shoulderElevation:        { en: Shoulder shrug, ar: رفع الكتف لفوق }
  plantarFlexion:           { en: Calf raise, ar: رفع السمانة }
  locomotion:               { en: Walking / running, ar: مشي / جري }
  jump:                     { en: Jumping, ar: نط }
  walking:                  { en: Walking, ar: مشي }
  cycling:                  { en: Cycling, ar: عجلة }
  mobility:                 { en: Mobility drill, ar: تمرين مرونة حركية }
  stretch:                  { en: Static stretch, ar: إطالة ثابتة }
  breathing:                { en: Breathing, ar: تنفّس }

# Joints an exercise puts meaningful load on. An exercise lists one or more.
joints:
  neck:     { en: Neck, ar: الرقبة }
  shoulder: { en: Shoulder, ar: الكتف }
  elbow:    { en: Elbow, ar: الكوع }
  wrist:    { en: Wrist, ar: الرسغ }
  spine:    { en: Back / spine, ar: الظهر / العمود الفقري }
  hip:      { en: Hip, ar: الحوض }
  knee:     { en: Knee, ar: الركبة }
  ankle:    { en: Ankle, ar: الكاحل }

# How far the loaded joint travels. Each exercise has exactly one.
ranges_of_motion:
  full:     { en: Full range, ar: مدى كامل }
  partial:  { en: Partial range, ar: مدى جزئي }
  overhead: { en: Arms overhead, ar: الدراع فوق الراس }

equipment:
  bodyweight: { en: Bodyweight, ar: وزن الجسم }
  dumbbells:  { en: Dumbbells, ar: دمبلز }
  barbell:    { en: Barbell, ar: بار }
  bench:      { en: Bench, ar: بنش }
  cable:      { en: Cable machine, ar: جهاز كابل }
  machine:    { en: Machine, ar: جهاز }
  landmine:   { en: Landmine, ar: لاندماين }
  bands:      { en: Resistance bands, ar: أستك مقاومة }
  pullUpBar:  { en: Pull-up bar, ar: بار عقلة }
  exerciseBall: { en: Exercise ball, ar: كورة تمارين }
  abWheel:    { en: Ab wheel, ar: عجلة بطن }
  jumpRope:   { en: Jump rope, ar: حبل نط }

# Injury: "which movements hurt?" (the onboarding chips).
# `excludes` says which exercises that movement rules out: every listed field must match. `joint_of_injury: true` means
# only exercises that load the injured area's joints (data/rules/safety.yaml region_joints): squatting that hurts a
# lower back rules out the barbell squat (it loads the spine) but not the leg press. `phrase` finishes the sentence
# "it involves …" in the reasons ("Arm circles are left out of your warm-up: it involves pressing overhead, which hurts …").
painful_movements:
  overheadPress: { en: Overhead press, ar: ضغط فوق الراس, phrase: { en: pressing overhead, ar: الضغط فوق الراس }, excludes: { movement_patterns: [verticalPush], ranges_of_motion: [overhead], joint_of_injury: true } }
  benchPress:    { en: Bench press, ar: بنش بريس, phrase: { en: bench pressing, ar: ضغط البنش }, excludes: { movement_patterns: [horizontalPush], ranges_of_motion: [full], joint_of_injury: true } }
  dips:          { en: Dips, ar: ديبس, phrase: { en: dips, ar: الديبس }, excludes: { movement_patterns: [dip], joint_of_injury: true } }
  pullUps:       { en: Pull-ups, ar: عقلة, phrase: { en: pulling up from overhead, ar: السحب من فوق الراس }, excludes: { movement_patterns: [verticalPull], ranges_of_motion: [full, overhead], joint_of_injury: true } }
  lateralRaise:  { en: Lateral raise, ar: رفرفة جانبي, phrase: { en: raising your arms to the side, ar: رفع الدراع للجنب }, excludes: { movement_patterns: [shoulderAbduction], joint_of_injury: true } }
  pushUps:       { en: Push-ups, ar: ضغط, phrase: { en: push-ups, ar: الضغط }, excludes: { movement_patterns: [horizontalPush], ranges_of_motion: [full], joint_of_injury: true } }
  squat:         { en: Squat, ar: سكوات, phrase: { en: squatting, ar: السكوات }, excludes: { movement_patterns: [squat], joint_of_injury: true } }
  deadlift:      { en: Deadlift, ar: رفعة ميتة, phrase: { en: bending at the hips under load, like a deadlift, ar: ثني الوسط بوزن زي الرفعة الميتة }, excludes: { movement_patterns: [hinge], joint_of_injury: true } }
  lunges:        { en: Lunges, ar: طعنات, phrase: { en: lunging, ar: الطعنات }, excludes: { movement_patterns: [lunge], joint_of_injury: true } }
  running:       { en: Running, ar: جري, phrase: { en: running or jumping, ar: الجري أو النط }, excludes: { movement_patterns: [locomotion, jump], joint_of_injury: true } }

# Injury: restrictions from a doctor or physio.
# `excludes` works as above. A restriction is about the injured area, so "no overhead lifting" for a lower back rules
# out overhead lifts that load the spine (the barbell overhead press), not arm circles. "No jumping or running" is the
# exception: impact jars the whole body, so it applies whatever the area.
# `load_factor` reduces the weight instead of removing exercises.
restrictions:
  noOverhead:  { en: No overhead lifting, ar: ممنوع الرفع فوق الراس, excludes: { ranges_of_motion: [overhead], joint_of_injury: true } }
  limitRange:  { en: Limit range, ar: مدى حركة محدود, excludes: { ranges_of_motion: [full, overhead], joint_of_injury: true } }
  noImpact:    { en: No jumping or running, ar: ممنوع النط والجري, excludes: { movement_patterns: [jump, locomotion] } }
  noHeavyLoad: { en: No heavy loads, ar: ممنوع الأوزان التقيلة, load_factor: 0.7 }
  noneSeen:    { en: "Haven't seen anyone", ar: ماروحتش لحد }
