# Every exercise name the three Jeff Nippard programs use → the catalogue exercise it is (data/catalogue/exercises.yaml).
# `technique` marks a way of doing that exercise (program_meta.yaml `techniques` explains each one); `choose` marks a
# slot the person fills (the Upper/Lower program's "weak point" exercises): `id` is the default.
# Read by scripts/books/programs.py (npm run books:programs).
