# Safety rules. Applied after the normal targets, and always win.
# Values with placeholder: false come from the books (ref); placeholder: true ones are medical safety settings no book
# gives numbers for (data/REVIEW.md lists them).
version: 1

calorie_floor:
  # The encyclopedia gives one figure for everyone (it was 1200 for women and 1500 for men before; see data/REVIEW.md).
  placeholder: false
  source: "Encyclopedia of Foods, ch. 3 (The Food-Health Connection), PDF p. 64 (printed p. 51)"
  uses: [sex]
  summary:
    en: Calories never go below 1,400 a day, because under that it's hard to get enough nutrients from food.
    ar: السعرات عمرها ما تنزل تحت ١٤٠٠ في اليوم، لأن تحت كده صعب تاخد كفايتك من العناصر الغذائية من الأكل.
  kcal: {female: 1400, male: 1400}
  ref:
    book: "Encyclopedia of Foods: A Guide to Healthy Nutrition (Dole, Mayo Clinic, UCLA)"
    chapter: "Chapter 3: The Food-Health Connection"
    page: "64 (printed 51)"
    quote:
      en: Eating fewer than about 1,400 calories a day makes a balanced diet with enough nutrients hard to achieve, so very low-calorie plans can be risky.
      ar: لما تاكل أقل من حوالي ١٤٠٠ سعرة في اليوم بيبقى صعب تاكل أكل متوازن فيه كفايتك من العناصر، فالأنظمة قليلة السعرات جدًا ممكن تبقى خطر.
  explain:
    en: "Raised to {floor} kcal: below this it's hard to get enough nutrients, and we never go lower without a doctor."
    ar: "اتعلّت لـ {floor} سعرة: تحت كده صعب تاخد كفايتك من العناصر، وعمرنا ما ننزل أقل من غير دكتور."

max_weekly_loss:
  # 1-2 pounds a week; 2 pounds = 0.9 kg is the cap. (It was 1% of body weight before; see data/REVIEW.md.)
  placeholder: false
  source: "Encyclopedia of Foods, ch. 3 (The Food-Health Connection), PDF pp. 64 and 66 (printed pp. 51 and 53)"
  uses: [pace]
  summary:
    en: The deficit is capped so you lose at most about 0.9 kg (2 pounds) a week, because slow, steady loss is the safe kind.
    ar: نقص السعرات له حد عشان ماتنزلش أكتر من حوالي ٠٫٩ كجم (٢ رطل) في الأسبوع، لأن النزول البطيء الثابت هو الآمن.
  max_kg_per_week: 0.9
  ref:
    book: "Encyclopedia of Foods: A Guide to Healthy Nutrition (Dole, Mayo Clinic, UCLA)"
    chapter: "Chapter 3: The Food-Health Connection"
    page: "64, 66 (printed 51, 53)"
    quote:
      en: Weight loss should be slow and steady, about 1 to 2 pounds a week.
      ar: نزول الوزن لازم يكون بطيء وثابت، حوالي رطل لـ ٢ رطل في الأسبوع.
  explain:
    en: "Capped at {calories} kcal so you lose no more than {max_kg} kg a week."
    ar: "اتحددت بـ {calories} سعرة عشان ماتنزلش أكتر من {max_kg} كجم في الأسبوع."

conservative:
  # Any "yes" in the onboarding health check.
  placeholder: true
  # The encyclopedia (p. 66) says to check with a doctor before exercising with a medical problem, but no book gives
  # the numbers below.
  source: "PLACEHOLDER: conservative numbers for a health flag (your books only say to check with a doctor first)"
  uses: [health]
  summary:
    en: 'Any yes in the health check keeps the plan gentler: a smaller deficit or surplus, lighter weights, lower effort and longer rests.'
    ar: 'أي إجابة بـ أيوه في أسئلة الصحة بتخلّي الخطة أهدى: نقص أو زيادة سعرات أقل، أوزان أخف، مجهود أقل وراحة أطول.'
  max_deficit_pct: 15
  max_surplus_kcal: 150
  training: {rpe_minus: 1, load_factor: 0.85, extra_rest_sec: 30}
  explain:
    en: "Kept conservative because of your health answers: {detail}. Please check with your doctor before starting."
    ar: "خلّيناها أهدى بسبب إجاباتك عن الصحة: {detail}. من فضلك اسأل دكتورك قبل ما تبدأ."

pregnancy:
  # Pregnant or gave birth in the last 6 months: no calorie deficit without medical advice.
  placeholder: true
  source: "PLACEHOLDER: no deficit during pregnancy or after giving birth without medical advice (not in your books)"
  uses: [health]
  summary:
    en: No calorie deficit during or soon after pregnancy without a doctor's advice.
    ar: مفيش نقص سعرات وقت الحمل أو بعد الولادة على طول من غير رأي دكتور.
  explain:
    en: "Kept at maintenance ({calories} kcal): no calorie deficit during or soon after pregnancy without your doctor's advice."
    ar: "على سعرات الثبات ({calories} سعرة): مفيش نقص سعرات وقت الحمل أو بعد الولادة على طول من غير رأي دكتورك."

red_flags:
  # Pain logs (after workouts and in the check-in). Any of these pauses the body area. We never diagnose.
  placeholder: true
  # The programs say not to train through pain that stops a full range of motion (Fundamentals FAQ, p. 22); the
  # symptoms and thresholds below are medical safety settings no book gives.
  source: "PLACEHOLDER: red-flag symptoms and pain thresholds (medical safety settings, not in your books)"
  uses: [injuries]
  summary:
    en: Sharp pain, swelling, numbness, worsening pain or high pain pauses that body area and asks you to see a doctor or physiotherapist. We never diagnose.
    ar: الألم الحاد أو التورم أو التنميل أو الألم اللي بيزيد أو الألم الشديد بيوقّف المنطقة دي ويطلب منك تكشف عند دكتور أو أخصائي علاج طبيعي. إحنا عمرنا ما بنشخّص.
  flags: [sharp_pain, swelling, numbness, worsening]
  pause_at_pain: 7               # pain this high (0-10) pauses the area
  rising_logs: 3                 # pain going up across this many logs in a row pauses the area
  message:
    en: "Please see a doctor or physiotherapist before training this area again."
    ar: "من فضلك اكشف عند دكتور أو أخصائي علاج طبيعي قبل ما تمرّن المنطقة دي تاني."

