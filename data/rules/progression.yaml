# How each exercise's target for the next session is chosen from last time ("double progression").
# Read by backend/app/progression.py. Worked examples: progression_cases.json (checked by the backend and browser tests).
#
#   1. No result yet                                   → planned sets × bottom of the range @ starting weight      (start)
#   2. Every planned set done at the top of the range,
#      and the last set wasn't a struggle              → add one weight step, back to the bottom of the range       (addWeight)
#   3. Struggled on the last set, or fewer sets done:
#        below the bottom of the range and struggled   → drop one weight step, bottom of the range                  (dropWeight)
#        otherwise                                     → repeat last time's reps (kept inside the range), same weight (repeat)
#   4. Otherwise                                       → same weight, `reps_per_step` more reps (up to the top)     (addReps)
#
# Exercises with no weight step (bodyweight) never add weight: they stay at the top of the range once they reach it.
version: 1
reps_per_step: 1
placeholder: false
uses: []
ref:
  book: Intermediate Advanced LPP Program (Jeff Nippard)
  chapter: "Training variables: weekly progression"
  page: 94–95
  quote:
    en: With a rep range, keep the weight and add reps until every set reaches the top of the range, then add weight and go back to the bottom.
    ar: لو فيه مدى عدات، ثبّت الوزن وزوّد العدات لحد ما كل المجموعات توصل لآخر المدى، وبعدين زوّد الوزن وارجع لأول المدى.
summary:
  en: "Double progression: add reps across the range, and when every set reaches the top without a struggle, add one weight step and start again at the bottom."
  ar: "التقدم المزدوج: زوّد العدات جوه المدى، ولما كل المجموعات توصل للآخر من غير صعوبة، زوّد خطوة وزن وابدأ من أول المدى تاني."
explain:
  en: "Every exercise starts at the bottom of its rep range. When all sets reach the top and the last one wasn't a struggle, the weight goes up one step ({steps}); otherwise add {reps} rep a session. A hard session repeats or drops a step."
  ar: "كل تمرين بيبدأ من أول مدى العدات. لما كل المجموعات توصل للآخر وآخر واحدة ماكانتش صعبة، الوزن بيزيد خطوة ({steps})؛ غير كده زوّد {reps} عدة كل مرة. والتمرينة الصعبة بتتكرر أو الوزن بينزل خطوة."
source: >-
  Intermediate Advanced LPP Program, Weekly progression, pp. 94-95; Upper Lower Strength and Size Program,
  Progression, p. 61 (one more rep a session); Fundamentals Hypertrophy Program, How do I progress?, pp. 82-84
