# Nutrition rules for the plan engine (backend/app/engine/nutrition.py and meals.py).
# Every number the engine produces comes from here, with a one-line reason built from `explain`.
# PLACEHOLDER values: clearly marked, to be replaced with values (and page numbers) extracted from the books next session.
version: 1

bmr:
  # Mifflin-St Jeor: 10 × kg + 6.25 × cm − 5 × age + 5 (men) or − 161 (women)
  placeholder: false
  source: "Mifflin MD, St Jeor ST et al. (1990) Am J Clin Nutr 51:241-247"
  uses: [sex, age, height_cm, weight_kg]
  summary:
    en: Your resting burn (the calories your body uses at rest) is worked out from your sex, age, height and weight with the Mifflin-St Jeor formula.
    ar: الحرق وقت الراحة (السعرات اللي جسمك بيصرفها وأنت مرتاح) بيتحسب من نوعك وسنك وطولك ووزنك بمعادلة ميفلين-سانت جيور.
  ref:
    book: American Journal of Clinical Nutrition, vol. 51 (Mifflin, St Jeor et al., 1990)
    chapter: A new predictive equation for resting energy expenditure in healthy individuals
    page: 241–247
    quote:
      en: Resting energy expenditure is predicted from weight, height and age, with one constant for men and another for women.
      ar: الطاقة وقت الراحة بتتحسب من الوزن والطول والسن، برقم ثابت للرجالة ورقم تاني للستات.
  explain:
    en: "Resting burn {bmr} kcal (Mifflin-St Jeor: {sex}, {age} years, {height} cm, {weight} kg)."
    ar: "الحرق وقت الراحة {bmr} سعرة (معادلة ميفلين-سانت جيور: {sex}، {age} سنة، {height} سم، {weight} كجم)."

activity:
  placeholder: true
  source: "PLACEHOLDER: activity multipliers by training days; book + page to be added (Helms, The Muscle & Strength Pyramid: Nutrition)"
  uses: [days_per_week]
  summary:
    en: Your resting burn is multiplied by an activity factor that grows with the number of training days a week.
    ar: الحرق وقت الراحة بيتضرب في معامل نشاط بيزيد مع عدد أيام التمرين في الأسبوع.
  factor_by_training_days: {2: 1.375, 3: 1.4, 4: 1.5, 5: 1.6, 6: 1.7}
  explain:
    en: "Maintenance about {tdee} kcal: resting burn × {factor} for {days} training days a week."
    ar: "سعرات الثبات حوالي {tdee} سعرة: الحرق وقت الراحة × {factor} لـ {days} أيام تمرين في الأسبوع."

goal:
  placeholder: true
  source: "PLACEHOLDER: deficit / surplus sizes; book + page to be added (Helms, The Muscle & Strength Pyramid: Nutrition; Nippard & Barakat, The Ultimate Guide to Body Recomposition)"
  uses: [goal, pace, experience, weight_kg]
  summary:
    loseFat:
      en: 'To lose fat, eat a little under maintenance: the gap is sized for the weekly pace you chose (1 kg of body weight is about 7,700 kcal).'
      ar: 'عشان تخس دهون، كُل أقل شوية من سعرات الثبات: الفرق متظبط على السرعة اللي اخترتها في الأسبوع (الكيلو من وزنك حوالي ٧٧٠٠ سعرة).'
    buildMuscle:
      en: To build muscle, eat a small surplus over maintenance, smaller the more experienced you are, so little of it becomes fat.
      ar: عشان تبني عضل، كُل زيادة صغيرة فوق الثبات، وبتصغر كل ما خبرتك تزيد، عشان أقل جزء منها يبقى دهون.
    recomp:
      en: 'For recomposition, eat about 10% under maintenance: enough to lose fat slowly while training builds muscle.'
      ar: 'لإعادة تشكيل الجسم، كُل حوالي ١٠٪ أقل من الثبات: كفاية تخس دهون ببطء والتمرين بيبني عضل.'
    strength:
      en: To get stronger, eat a small surplus so you recover from heavy training.
      ar: عشان تبقى أقوى، كُل زيادة صغيرة عشان تتعافى من التمرين التقيل.
    final:
      en: The calorie target after every safety limit has been applied.
      ar: هدف السعرات بعد ما كل حدود الأمان اتطبقت.
  kcal_per_kg: 7700              # energy in 1 kg of body weight change
  loseFat: {kg_per_week: {gentle: 0.25, steady: 0.5, faster: 0.75}}
  buildMuscle: {surplus_kcal: {beginner: 300, intermediate: 200, advanced: 150}}
  recomp: {deficit_pct: 10}
  strength: {surplus_kcal: {beginner: 150, intermediate: 100, advanced: 100}}
  explain:
    loseFat:
      en: "Target {calories} kcal: about {deficit} kcal under maintenance, to lose about {rate} kg a week ({pace} pace)."
      ar: "الهدف {calories} سعرة: حوالي {deficit} سعرة أقل من الثبات، عشان تنزل حوالي {rate} كجم في الأسبوع."
    buildMuscle:
      en: "Target {calories} kcal: {surplus} kcal over maintenance, a small surplus to build muscle with little fat."
      ar: "الهدف {calories} سعرة: {surplus} سعرة فوق الثبات، زيادة بسيطة عشان تبني عضل من غير دهون كتير."
    recomp:
      en: "Target {calories} kcal: {pct}% under maintenance, to lose fat slowly while building muscle."
      ar: "الهدف {calories} سعرة: {pct}% أقل من الثبات، عشان تخس دهون ببطء وأنت بتبني عضل."
    strength:
      en: "Target {calories} kcal: {surplus} kcal over maintenance, enough to recover from heavy training."
      ar: "الهدف {calories} سعرة: {surplus} سعرة فوق الثبات، كفاية عشان تتعافى من التمرين التقيل."
    final:
      en: "Daily target after the safety limits: {calories} kcal."
      ar: "الهدف اليومي بعد حدود الأمان: {calories} سعرة."

protein:
  placeholder: true
  source: "PLACEHOLDER: protein per kg; book + page to be added (Helms, The Muscle & Strength Pyramid: Nutrition)"
  uses: [weight_kg, height_cm, goal]
  summary:
    en: Protein is set per kg of body weight for your goal. Above a BMI of 25 it uses the weight you'd have at BMI 25, because extra body fat doesn't need extra protein.
    ar: البروتين بيتحسب لكل كيلو من وزنك حسب هدفك. لو مؤشر كتلة الجسم فوق ٢٥ بيتحسب من الوزن اللي عند ٢٥، لأن الدهون الزيادة مش محتاجة بروتين زيادة.
  g_per_kg: {loseFat: 2.0, buildMuscle: 1.8, recomp: 2.0, strength: 1.8}
  # Above BMI `bmi_from`, protein is worked out from the weight you'd have at BMI `reference_bmi`
  # (extra body fat doesn't need extra protein).
  bmi_from: 25
  reference_bmi: 25
  explain:
    en: "Protein {protein} g: {per_kg} g per kg of {basis} kg."
    ar: "بروتين {protein} جم: {per_kg} جم لكل كيلو من {basis} كجم."

fat:
  placeholder: true
  source: "PLACEHOLDER: fat minimum; book + page to be added (Helms, The Muscle & Strength Pyramid: Nutrition)"
  uses: [weight_kg]
  summary:
    en: Fat never goes below a minimum (per kg of body weight or a share of calories, whichever is higher), for hormones and vitamins.
    ar: الدهون عمرها ما تنزل تحت حد أدنى (لكل كيلو من وزنك أو نسبة من السعرات، الأعلى فيهم)، عشان الهرمونات والفيتامينات.
  min_g_per_kg: 0.7
  min_pct_of_calories: 25
  explain:
    en: "Fat {fat} g: the higher of {per_kg} g per kg and {pct}% of calories, for hormones and vitamins."
    ar: "دهون {fat} جم: الأعلى بين {per_kg} جم لكل كيلو و{pct}% من السعرات، عشان الهرمونات والفيتامينات."

carbs:
  placeholder: true
  source: "PLACEHOLDER: carbohydrate from the remainder; book + page to be added (Helms, The Muscle & Strength Pyramid: Nutrition)"
  uses: [goal]
  summary:
    en: Carbs fill the calories left after protein and fat, to fuel your training.
    ar: الكربوهيدرات بتكمّل السعرات اللي فاضلة بعد البروتين والدهون، عشان تدّي طاقة للتمرين.
  min_g: 50
  explain:
    en: "Carbs {carbs} g: the calories left after protein and fat, to fuel training."
    ar: "كربوهيدرات {carbs} جم: السعرات اللي باقية بعد البروتين والدهون، عشان طاقة التمرين."

meals:
  placeholder: true
  source: "PLACEHOLDER: meal planning settings; to be checked against the Arabic recipe book (Diet & Cheat)"
  uses:
    default:
    - meals_per_day
    - fasting
    - cooking_minutes
    - dislikes
    - allergies
    portions:
    - meals_per_day
    - cooking_minutes
    - dislikes
    - allergies
  summary:
    default:
      en: A small optimizer picks a recipe and a portion for every meal so each day lands within 5% of your calories with at least your protein, with no disliked foods or allergens and within your cooking time.
      ar: برنامج حساب صغير بيختار وصفة وكمية لكل وجبة عشان كل يوم يبقى في حدود ٥٪ من سعراتك وفيه البروتين بتاعك على الأقل، من غير أكلات مش بتحبها أو بتعملك حساسية وفي حدود وقت الطبخ.
    relaxed:
      en: When no combination fits every limit, one limit is eased at a time (cooking time first, calories last) and the plan says which.
      ar: لو مفيش توليفة مناسبة لكل الحدود، بيتساهل حد واحد في المرة (وقت الطبخ الأول، والسعرات آخر حاجة) والخطة بتقول أنهي.
    portions:
      en: Each recipe's portion moves in quarter steps (½ to 2½ servings) until the day hits your calories and protein.
      ar: كمية كل وصفة بتتغير بالربع (من نص لاتنين ونص حصة) لحد ما اليوم يوصل لسعراتك والبروتين.
  slots_by_meals_per_day:
    2: [breakfast, dinner]
    3: [breakfast, lunch, dinner]
    4: [breakfast, lunch, snack, dinner]
    5: [breakfast, snack, lunch, snack, dinner]
  ramadan_slots_by_meals_per_day:
    2: [suhoor, iftar]
    3: [suhoor, iftar, snack]
    4: [suhoor, iftar, snack, snack]
    5: [suhoor, iftar, snack, snack, snack]
  times: {breakfast: "08:30", lunch: "14:30", snack: "18:30", dinner: "21:00", suhoor: "03:30", iftar: "18:00"}
  intermittent_times: {breakfast: "12:00", lunch: "15:00", snack: "17:30", dinner: "19:30"}
  ramadan_times: {suhoor: "03:30", iftar: "18:00", snack: "21:30"}
  # Approximate Ramadan dates (they depend on the moon sighting).
  ramadan: [{start: 2026-02-18, end: 2026-03-19}, {start: 2027-02-08, end: 2027-03-09}, {start: 2028-01-28, end: 2028-02-26}]
  calorie_tolerance_pct: 5       # each day within ±5% of target calories
  portion_step: 0.25             # portions move in quarters
  portion_min: 0.5
  portion_max: 2.5
  max_uses_per_week: 4           # the same recipe at most this many times a week
  max_uses_per_week_snack: 7     # snacks (zabadi, a sandwich…) can be the same every day
  # Weights for "close to the carb and fat targets" in the optimizer (calories and protein are hard limits).
  weights: {kcal: 1.0, carbs: 0.5, fat: 0.5, variety: 20}
  explain:
    en: "Meals: {meals} a day, each day within {tol}% of {calories} kcal with at least {protein} g protein."
    ar: "الوجبات: {meals} في اليوم، كل يوم في حدود {tol}% من {calories} سعرة وفيه {protein} جم بروتين على الأقل."

  # If no day fits, these limits are eased one at a time (cooking, variety, meal times, protein, calories) and the plan says so.
  relaxed:
    cooking:
      en: "Your cooking time didn't leave enough recipes for every day, so some days take a little longer to cook."
      ar: "وقت الطبخ اللي عندك ماكانش كفاية لوصفات كل يوم، فبعض الأيام هتاخد وقت أطول شوية."
    slots:
      en: "Some meals use a recipe from another meal time, because none of the recipes for it fit your answers yet."
      ar: "بعض الوجبات فيها وصفة من وقت تاني، لأن مفيش وصفات لوقتها مناسبة لإجاباتك لسه."
    protein:
      en: "Protein is a little under target on some days (at least {pct}%) with the recipes available now."
      ar: "البروتين أقل من الهدف شوية في بعض الأيام (على الأقل {pct}%) بالوصفات المتاحة دلوقتي."
    calories:
      en: "Some days are within {pct}% of your calories (not {tol}%) with the recipes available now."
      ar: "بعض الأيام في حدود {pct}% من سعراتك (مش {tol}%) بالوصفات المتاحة دلوقتي."
    variety:
      en: "Some recipes repeat more often this week because few recipes fit your preferences yet."
      ar: "بعض الوصفات بتتكرر أكتر الأسبوع ده لأن وصفات قليلة لسه مناسبة لاختياراتك."
  relax_protein_pct: 95
  relax_calorie_pct: 8
  # One line per recipe in the week ("Why this plan": meal choices and portions).
  explain_portions:
    en: "{name}: {times}× this week ({slots}), {portion} of the recipe each time ({kcal} kcal, {protein} g protein), sized so each day hits your targets. No food you dislike or are allergic to; about {minutes} min to make."
    ar: "{name}: {times} مرات الأسبوع ده ({slots})، {portion} من الوصفة كل مرة ({kcal} سعرة، {protein} جم بروتين)، متظبطة عشان كل يوم يوصل لأهدافك. مفيهاش أكل مش بتحبه أو بيعملك حساسية؛ حوالي {minutes} دقيقة تحضير."
  slot_names:
    breakfast: {en: breakfast, ar: الفطار}
    lunch: {en: lunch, ar: الغدا}
    snack: {en: after the gym, ar: بعد الجيم}
    dinner: {en: dinner, ar: العشا}
    suhoor: {en: suhoor, ar: السحور}
    iftar: {en: iftar, ar: الفطار}

# ── Removing an ingredient from a meal (backend/app/engine/ingredients.py) ──────────────────
# Replacements have the same role (data/catalogue/foods.yaml `role`) and are sized to match what the removed food gave:
# its protein for a protein, carbs for a carb, fat for a fat, the same grams for vegetables and fruit; flavours
# (garlic, cumin, lemon…) are simply left out. Then, if the day fell below its targets (protein first), other meals'
# portions move by at most `max_portion_change` (in the usual quarter steps and portion limits) to bring it back; if
# that isn't enough, a small snack is suggested.
ingredients:
  placeholder: true
  source: "PLACEHOLDER: ingredient swaps by food role and day rebalancing; to be checked against the Arabic recipe book (Diet & Cheat)"
  uses: [dislikes, allergies]
  summary:
    en: "A removed ingredient can be replaced by a food with the same role, sized to give about the same protein, carbs or fat; if the day then falls short, other portions grow a little or a snack is suggested."
    ar: "المكوّن اللي بتشيله ممكن يتبدّل بأكلة ليها نفس الدور، بكمية بتدّي نفس البروتين أو الكربوهيدرات أو الدهون تقريبًا؛ ولو اليوم نقص، الكميات التانية بتزيد شوية أو بنقترح سناك."
  max_replacements: 3
  match_by_role: {protein: protein, eggsDairy: protein, legume: protein, carb: carbs, fat: fat, vegetable: grams, fruit: grams, flavour: none}
  replacement_round_g: 5
  max_replacement_factor: 3      # a replacement is never more than 3 × the grams it replaces
  max_portion_change: 0.5        # rebalancing moves each other meal's portion by at most this much
  explain:
    removed:
      en: "{name} removed from {meal}."
      ar: "{name} اتشال من {meal}."
    replaced:
      en: "{name} → {to} ({grams} g) in {meal}."
      ar: "{name} ← {to} ({grams} جم) في {meal}."
    rebalanced:
      en: "To keep the day on target: {meal} now {to} of the recipe (was {from})."
      ar: "عشان اليوم يفضل على الهدف: {meal} بقت {to} من الوصفة (كانت {from})."
    on_target:
      en: "The day is still on target: {kcal} kcal and {protein} g protein."
      ar: "اليوم لسه على الهدف: {kcal} سعرة و{protein} جم بروتين."
    snack:
      en: "Still {short} g protein short: add {name} ({portion} of the recipe, {kcal} kcal, {protein} g protein) as a snack."
      ar: "لسه ناقص {short} جم بروتين: زوّد {name} ({portion} من الوصفة، {kcal} سعرة، {protein} جم بروتين) كسناك."
    short:
      en: "This day is now {short} g protein under your target; tomorrow's meals are unchanged."
      ar: "اليوم ده بقى أقل من هدفك بـ {short} جم بروتين؛ وجبات بكرة زي ما هي."

grocery:
  placeholder: true
  source: "PLACEHOLDER: weeks in a month for the monthly staples list"
  monthly_factor: 4.3

review:
  # Weekly review: calories move in small, bounded steps (backend/app/engine/review.py).
  # Expected weekly change = (target − maintenance) × 7 / kcal_per_kg. Compared with the 7-day average weight trend.
  placeholder: true
  source: "PLACEHOLDER: weekly calorie adjustments; book + page to be added (Helms, The Muscle & Strength Pyramid: Nutrition)"
  uses: [checkin]
  summary:
    en: Each week, calories move by one small step only when your weight trend is clearly faster or slower than planned and you followed most meals.
    ar: كل أسبوع، السعرات بتتحرك خطوة صغيرة بس لو وزنك بيتغير أسرع أو أبطأ من المخطط بوضوح وأنت ملتزم بأغلب الوجبات.
  calorie_step: 100
  min_adherence_pct: 70          # below this, calories stay the same: follow the plan first
  too_fast_factor: 1.5           # changing more than 1.5 × expected (plus slack) → move calories back by one step
  too_slow_factor: 0.5           # changing less than half of expected → move calories on by one step
  slack_kg: 0.2                  # daily weight noise
  explain:
    too_fast:
      en: "{before} → {after} kcal: you changed {actual} kg this week, faster than the {expected} kg planned."
      ar: "{before} ← {after} سعرة: وزنك اتغيّر {actual} كجم الأسبوع ده، أسرع من الـ {expected} كجم المخططين."
    too_slow:
      en: "{before} → {after} kcal: you changed {actual} kg this week, slower than the {expected} kg planned, while following {adherence}% of meals."
      ar: "{before} ← {after} سعرة: وزنك اتغيّر {actual} كجم الأسبوع ده، أبطأ من الـ {expected} كجم المخططين، وأنت ملتزم بـ {adherence}% من الوجبات."
    low_adherence:
      en: "Calories stay at {calories} kcal: you followed {adherence}% of meals, so let's get closer to the plan first."
      ar: "السعرات تفضل {calories} سعرة: التزمت بـ {adherence}% من الوجبات، فخلّينا نقرّب من الخطة الأول."

# Cardio and calories: the activity factor above already counts the training days and the weekly cardio, so cardio
# calories are never added on top (that would count them twice). The plan says so in the calorie reasons.
cardio_counted:
  placeholder: true
  source: "PLACEHOLDER: activity level and cardio; book + page to be added"
  uses: [days_per_week, goal]
  summary:
    en: 'Cardio calories are counted once: the activity level already includes your weekly cardio, so they''re never added on top.'
    ar: 'سعرات الكارديو بتتحسب مرة واحدة: مستوى النشاط فيه الكارديو بتاع الأسبوع، فمش بتتزاد فوقه.'
  explain:
    en: "Your {sessions} cardio sessions a week ({minutes} min each) are already counted in the activity level (× {factor}); their calories aren't added again."
    ar: "جلسات الكارديو ({sessions} في الأسبوع، {minutes} دقيقة) محسوبة في مستوى النشاط (× {factor})؛ سعراتها مش بتتزاد تاني."
