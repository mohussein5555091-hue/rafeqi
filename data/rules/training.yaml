    pain: {en: "it caused pain", ar: "كان بيوجعك"}

# ── What the "Why this plan" page explains (and the reasons the engine stores for them) ────────────
# Training days and session length: the days come from `schedules` above.
schedule:
  placeholder: true
  source: "PLACEHOLDER: training days and session length; to be checked against the Jeff Nippard programs' weekly layout"
  uses: [days_per_week, session_minutes]
  summary:
    en: "You train on the days a week you chose, spread over the week with Friday free, for about the session length you chose."
    ar: "بتتمرن عدد الأيام اللي اخترته، متوزعين على الأسبوع والجمعة إجازة، لمدة التمرينة اللي اخترتها تقريبًا."
  explain:
    en: "{days} training days a week ({names}), about {minutes} min each, as you chose."
    ar: "{days} أيام تمرين في الأسبوع ({names})، حوالي {minutes} دقيقة كل مرة، زي ما اخترت."
  day_names:
    sat: {en: Sat, ar: السبت}
    sun: {en: Sun, ar: الأحد}
    mon: {en: Mon, ar: الاتنين}
    tue: {en: Tue, ar: التلات}
    wed: {en: Wed, ar: الأربع}
    thu: {en: Thu, ar: الخميس}
    fri: {en: Fri, ar: الجمعة}

# Sets, reps and effort (RPE: 10 = nothing left, 8 = two more reps possible) come from the program template's day.
volume:
  placeholder: true
  source: "PLACEHOLDER: sets, reps, rest and RPE per exercise; to be replaced with the Jeff Nippard programs' prescriptions"
  uses: [experience, goal, health]
  summary:
    en: "Each exercise's sets, rep range, rest and effort (RPE) come from the program; effort is lower and rests longer with a health flag."
    ar: "عدد المجموعات والعدات والراحة والمجهود (RPE) لكل تمرين جايين من البرنامج؛ والمجهود أقل والراحة أطول لو فيه علامة صحية."
  explain:
    en: "{name}: {exercises} exercises, {sets} sets in all, {reps} reps, effort RPE {rpe}, rests {rest} s."
    ar: "{name}: {exercises} تمارين، {sets} مجموعة في المجموع، {reps} عدة، مجهود {rpe}، راحة {rest} ثانية."

# The "lighter week": planned by the program, and triggered early by a hard week in the check-in (`review.deload_when`).
deload:
  placeholder: true
  source: "PLACEHOLDER: deload timing; to be replaced with the Jeff Nippard programs' deload weeks (Helms, The Muscle & Strength Pyramid: Training)"
  uses: [checkin]
  summary:
    en: "A lighter week (one set fewer, effort one lower) lets joints and muscles recover: planned by the program, or sooner when a check-in says training felt too hard."
    ar: "أسبوع أخف (مجموعة أقل ومجهود أقل بدرجة) بيدّي المفاصل والعضل فرصة تتعافى: البرنامج بيحدده، أو بدري لو المتابعة قالت إن التمرين كان صعب أوي."
  explain:
    en: "Week {week} of {total} is a lighter week. A check-in that says sessions felt very hard (difficulty {difficulty}/5, soreness {soreness}/5 or effort RPE {effort}+) makes the next week lighter too."
    ar: "الأسبوع {week} من {total} أسبوع أخف. ولو المتابعة قالت إن التمرين كان صعب جدًا (صعوبة {difficulty}/5 أو تكسير {soreness}/5 أو مجهود {effort} أو أكتر) الأسبوع اللي بعده هيبقى أخف كمان."
  explain_none:
    en: "A check-in that says sessions felt very hard (difficulty {difficulty}/5, soreness {soreness}/5 or effort RPE {effort}+) makes the next week lighter."
    ar: "لو المتابعة قالت إن التمرين كان صعب جدًا (صعوبة {difficulty}/5 أو تكسير {soreness}/5 أو مجهود {effort} أو أكتر) الأسبوع اللي بعده هيبقى أخف."

# Exercises that need equipment you don't have are swapped for the same movement with what you have.
equipment:
  placeholder: true
  source: "PLACEHOLDER: exercise choice by equipment; to be checked against the Jeff Nippard programs' substitution lists"
  uses: [location, missing_equipment]
  summary:
    en: "Exercises that need equipment your training place doesn't have (or that you said is missing) are swapped for the same movement with what you have."
    ar: "التمارين اللي محتاجة أدوات مش موجودة في مكان تمرينك (أو قلت إنها مش متاحة) بتتبدّل بنفس الحركة باللي عندك."
