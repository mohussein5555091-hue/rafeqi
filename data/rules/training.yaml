# Training rules for the plan engine (backend/app/engine/training.py). Templates live in data/programs/.
# PLACEHOLDER values: clearly marked, to be replaced with values (and page numbers) extracted from the books next session.
version: 1

template_choice:
  # Only templates made for where the person trains are considered (all of them, if none is).
  # Each one scores points for every match; the highest score wins (ties: file order).
  placeholder: true
  source: "PLACEHOLDER: program choice by experience, days, goal and equipment (Jeff Nippard programs)"
  uses: [experience, days_per_week, goal, location]
  summary:
    en: The program that best matches your experience, training days, goal and training place is chosen.
    ar: بيتختار البرنامج الأنسب لخبرتك وأيام تمرينك وهدفك ومكان تمرينك.
  points: {experience: 4, days: 4, goal: 1, location: 1}  # ties: the first file wins (sample_full_body, the gentler one)
  explain:
    en: "Program: {name}, chosen for {experience} lifters training {days} days a week."
    ar: "البرنامج: {name}، اتختار لمستوى {experience} وبتتمرن {days} أيام في الأسبوع."
  explain_days:
    en: "This program runs {program_days} days a week; you chose {days}. More programs come with the real templates."
    ar: "البرنامج ده {program_days} أيام في الأسبوع؛ أنت اخترت {days}. برامج أكتر هتيجي مع البرامج الحقيقية."

# Training days for each number of days a week (the Egyptian week starts on Saturday; Friday stays free).
schedules:
  2: [sat, tue]
  3: [sat, mon, wed]
  4: [sat, mon, wed, thu]
  5: [sat, sun, mon, wed, thu]
  6: [sat, sun, mon, tue, wed, thu]

# What each training place has. `bodyweight` is always available.
equipment_by_location:
  gym: [bodyweight, dumbbells, barbell, bench, cable, machine, landmine, bands, pullUpBar, jumpRope]
  homeDumbbells: [bodyweight, dumbbells, bench, bands, jumpRope]
  bodyweight: [bodyweight, bands, jumpRope]

# Weight steps by equipment (the smallest jump people can make).
weight_step_kg: {jumpRope: 0, dumbbells: 2, barbell: 2.5, landmine: 2.5, cable: 2.5, machine: 5, bodyweight: 0, bands: 0, pullUpBar: 0, bench: 0}

start_load:
  # Starting weight = body weight × ratio × experience × sex (× any load factor), rounded down to the weight step,
  # then capped for the experience level (max_kg, per dumbbell for dumbbells). Starting light on purpose: the first
  # sessions are for finding your weight, and "Done as planned" then progresses with progression.yaml.
  # Dumbbell ratios are per dumbbell.
  placeholder: true
  source: "PLACEHOLDER: starting load ratios; to be replaced with the program PDFs' guidance"
  uses: [weight_kg, sex, experience]
  summary:
    en: Starting weights are a share of your body weight for each exercise, lowered for experience and sex, rounded down and capped, so the first sessions are for finding your weight.
    ar: أوزان البداية نسبة من وزنك لكل تمرين، بتقل حسب خبرتك ونوعك، ومتقرّبة لتحت وليها حد أقصى، عشان أول تمرينات تكون لمعرفة وزنك.
  experience_factor: {beginner: 0.4, intermediate: 0.7, advanced: 0.9}
  sex_factor: {male: 1.0, female: 0.6}
  max_kg:
    beginner: {dumbbells: 10, barbell: 40, landmine: 15, cable: 25, machine: 60}
    intermediate: {dumbbells: 22, barbell: 80, landmine: 25, cable: 45, machine: 120}
    advanced: {dumbbells: 32, barbell: 120, landmine: 35, cable: 60, machine: 180}
  ratio:
    ex_db_floor_press: 0.25
    ex_db_bench_press: 0.25
    ex_bb_bench_press: 0.7
    ex_cs_row: 0.25
    ex_one_arm_db_row: 0.28
    ex_landmine_press: 0.2
    ex_db_shoulder_press: 0.17
    ex_ohp: 0.45
    ex_lat_pulldown: 0.55
    ex_face_pull: 0.18
    ex_pushdown: 0.25
    ex_incline_curl: 0.11
    ex_lateral_raise: 0.07
    ex_goblet_squat: 0.27
    ex_bb_squat: 0.9
    ex_leg_press: 1.2
    ex_db_rdl: 0.25
    ex_bb_deadlift: 1.1
    ex_split_squat: 0.12
    ex_seated_leg_curl: 0.45
    ex_leg_extension: 0.4
    ex_calf_raise: 0.6
    ex_glute_bridge: 0
    ex_walking_lunge_bw: 0
  explain:
    en: "Starting weight {kg} kg: {ratio} × your weight, adjusted for experience. Adjust it after the first session if it feels off."
    ar: "وزن البداية {kg} كجم: {ratio} × وزنك، متظبط على مستواك. عدّله بعد أول تمرينة لو حاسس إنه مش مظبوط."

injuries:
  placeholder: true
  source: "PLACEHOLDER: training around injuries; book + page to be added (Delavier, Strength Training Anatomy, for joint loading)"
  uses: [injuries]
  summary:
    en: Exercises that use a movement that hurts are swapped for the closest exercise with the same movement that avoids it; recovering areas start lighter.
    ar: التمارين اللي فيها حركة بتوجعك بتتبدّل بأقرب تمرين بنفس الحركة من غيرها؛ والمناطق اللي بتتعافى بتبدأ بوزن أخف.
  recovering_load_factor: 0.8    # exercises loading a "recovering" area start lighter
  min_load_factor: 0.5
  # How close a substitute is: lower is closer. Only exercises with the same movement pattern are considered.
  substitute_penalty: {different_range: 1, different_equipment: 1, harder_than_you: 3, per_difficulty_step: 1}
  # {why}: a painful movement's phrase ("pressing overhead") or a restriction's name ("No overhead lifting"),
  # data/vocab/movements.yaml.
  explain:
    swapped:
      en: "{from} → {to}: {to} avoids {why}, which hurts your {area}."
      ar: "{from} ← {to}: {to} مافيهوش {why}، اللي بيوجع {area}."
    swapped_restriction:
      en: "{from} → {to}: {to} keeps to the \"{why}\" restriction for your {area}."
      ar: "{from} ← {to}: {to} ماشي مع قيد «{why}» على {area}."
    removed:
      en: "{from} removed: nothing in the catalogue avoids {why}, which hurts your {area}, yet."
      ar: "{from} اتشال: لسه مفيش تمرين في القائمة من غير {why}، اللي بيوجع {area}."
    removed_restriction:
      en: "{from} removed: nothing in the catalogue keeps to the \"{why}\" restriction for your {area} yet."
      ar: "{from} اتشال: لسه مفيش تمرين في القائمة ماشي مع قيد «{why}» على {area}."
    load:
      en: "{name} at {pct}% load while your {area} is {status}."
      ar: "{name} بـ {pct}% من الوزن وأنت {area} {status}."
    paused:
      en: "{name} paused: your {area} needs checking first. {message}"
      ar: "{name} متوقف: {area} محتاج كشف الأول. {message}"
  equipment:
    en: "{from} → {to}: {to} works the same movement with the equipment you have."
    ar: "{from} ← {to}: {to} بيشغّل نفس الحركة بالأدوات اللي عندك."
  equipment_removed:
    en: "{from} removed: nothing in the catalogue does this movement with your equipment yet."
    ar: "{from} اتشال: لسه مفيش في القائمة تمرين بيعمل الحركة دي بأدواتك."

review:
  # Weekly review: small, bounded steps (backend/app/engine/review.py).
  placeholder: true
  source: "PLACEHOLDER: weekly adjustments; book + page to be added (Helms, The Muscle & Strength Pyramid: Training)"
  uses:
    default:
    - checkin
    uncomfortable:
    - checkin
    pain_up:
    - injuries
    - checkin
  summary:
    default:
      en: 'Each week the lifts change in small steps from your check-in: a lighter week when sessions felt too hard, and ± one step for exercises you marked too easy or too hard.'
      ar: 'كل أسبوع التمارين بتتغير خطوات صغيرة من متابعتك: أسبوع أخف لو التمرين كان صعب أوي، وخطوة زيادة أو نقص للتمارين اللي قلت إنها سهلة أو صعبة.'
    deload:
      en: A lighter week (one set fewer, effort one lower) when your check-in says sessions felt very hard, you're very sore or average effort was RPE 9 or more.
      ar: أسبوع أخف (مجموعة أقل ومجهود أقل بدرجة) لما متابعتك تقول إن التمرين كان صعب جدًا أو عندك تكسير شديد أو متوسط المجهود ٩ أو أكتر.
    uncomfortable:
      en: An exercise you marked uncomfortable is swapped for the closest one with the same movement.
      ar: التمرين اللي قلت إنه مش مريح بيتبدّل بأقرب تمرين بنفس الحركة.
    pain_up:
      en: When pain in an area goes up, the exercises that load it get lighter.
      ar: لما الألم في منطقة يزيد، التمارين اللي بتحمّل عليها بتخف.
  deload_when: {difficulty_at_least: 5, soreness_at_least: 4, avg_effort_at_least: 9}
  deload_load_factor: 0.9
  pain_up_load_step: 0.1         # pain went up: that area's exercises lose this much load factor

# ── Session length ───────────────────────────────────────────────────
# How many exercises fit the session length the person chose, and how the time estimate is worked out:
# warm-up + every set (work + rest) + a minute to change exercise + cool-down. Exercises are taken from the template day
# in order until the session is full (but at least `min`). backend/app/engine/training.py
session:
  placeholder: true
  source: "PLACEHOLDER: session length and exercise count; to be replaced with the Jeff Nippard programs' session structure"
  uses: [session_minutes]
  summary:
    en: As many exercises as fit the session length you chose; the time is worked out from the warm-up, every set's work and rest, changing exercise, and the cool-down.
    ar: عدد التمارين اللي يناسب مدة التمرينة اللي اخترتها؛ والوقت بيتحسب من التسخين وكل مجموعة بشغلها وراحتها وتغيير التمرين والتهدئة.
  work_sec_per_set: 40
  change_exercise_sec: 60
  exercises_by_minutes:
    45: {min: 4, max: 5}
    60: {min: 5, max: 6}
    75: {min: 6, max: 7}
    90: {min: 6, max: 8}
  explain:
    en: "About {minutes} min: warm-up {warmup} min, {exercises} exercises with their sets and rests ({lifting} min), cool-down {cooldown} min."
    ar: "حوالي {minutes} دقيقة: تسخين {warmup} دقيقة، {exercises} تمارين بمجموعاتها وراحتها ({lifting} دقيقة)، وتهدئة {cooldown} دقيقة."

# Every full-body day trains the legs: if injuries or equipment removed every squat and hip hinge, the engine adds the
# closest leg exercise that's allowed, in this order of movement patterns.
full_body_legs:
  placeholder: true
  source: "PLACEHOLDER: full-body session structure (Jeff Nippard, Fundamentals Hypertrophy Program)"
  uses: [injuries, location]
  summary:
    en: 'Every full-body day trains your legs: if injuries or equipment rule out the squat and hip hinge, the closest allowed leg exercise is added.'
    ar: 'كل يوم جسم كامل بيمرّن الرجل: لو الإصابات أو الأدوات منعت السكوات وثني الوسط، بيتضاف أقرب تمرين رجل مسموح.'
  patterns: [squat, hinge, lunge, kneeExtension, kneeFlexion]
  explain:
    en: "{name} added: every full-body day trains your legs, and the squat or hip hinge didn't fit your answers."
    ar: "{name} اتضاف: كل يوم جسم كامل بيمرّن رجلك، والسكوات أو ثني الوسط ماناسبوش إجاباتك."

# ── Warm-up (about 8–10 min, before every session) ───────────────────
# 1. General: `general_minutes` of easy movement, the first option that fits the equipment and injuries.
# 2. Mobility: `moves.min`–`moves.max` moves for the day's muscles (upper / lower / full). A move that an injury's
#    painful movements or restrictions rule out (data/vocab/movements.yaml) is skipped, with the reason.
# 3. Ramp-up: lighter sets of the first main exercise, as % of that session's target weight, rounded down to the
#    weight step. An extra heavier one when the target is at least `extra_from_kg`; none below `min_target_kg`.
#    backend/app/engine/warmup.py
warmup:
  placeholder: true
  source: "PLACEHOLDER: warm-up protocol; the Jeff Nippard programs include warm-up guidance to extract"
  uses: [location, injuries, health]
  summary:
    en: 'Before every session: 5 minutes of easy movement for your equipment, 3–4 mobility moves for the day''s muscles, and lighter ramp-up sets of the first exercise; anything that hurts an injury is left out.'
    ar: 'قبل كل تمرينة: ٥ دقايق حركة خفيفة حسب أدواتك، ٣–٤ حركات مرونة لعضلات اليوم، ومجموعات أخف لأول تمرين؛ وأي حاجة بتضر إصابة بتتشال.'
  general_minutes: 5
  general_by_location:
    gym: [ex_bike, ex_incline_walk, ex_brisk_walk]
    homeDumbbells: [ex_march_in_place, ex_jump_rope, ex_brisk_walk]
    bodyweight: [ex_march_in_place, ex_jump_rope, ex_brisk_walk]
  conservative_avoid_patterns: [jump]   # health flag: no jumping in the warm-up
  moves: {min: 3, max: 4}
  move_minutes: 0.5
  moves_by_kind:
    upper:
      - {id: ex_arm_circles, amount: {en: "10 each way", ar: "10 في كل اتجاه"}}
      - {id: ex_band_pull_apart, amount: {en: "15 reps", ar: "15 عدة"}}
      - {id: ex_dynamic_chest, amount: {en: "10 reps", ar: "10 عدات"}}
      - {id: ex_cat_cow, amount: {en: "8 slow reps", ar: "8 عدات ببطء"}}
      - {id: ex_inchworm, amount: {en: "5 reps", ar: "5 عدات"}}
    lower:
      - {id: ex_leg_swings, amount: {en: "10 each leg", ar: "10 لكل رجل"}}
      - {id: ex_hip_circles, amount: {en: "10 each way", ar: "10 في كل اتجاه"}}
      - {id: ex_bw_squat, amount: {en: "10 reps", ar: "10 عدات"}}
      - {id: ex_glute_bridge, amount: {en: "12 reps", ar: "12 عدة"}}
      - {id: ex_walking_lunge_bw, amount: {en: "6 each leg", ar: "6 لكل رجل"}}
      - {id: ex_cat_cow, amount: {en: "8 slow reps", ar: "8 عدات ببطء"}}
    full:
      - {id: ex_arm_circles, amount: {en: "10 each way", ar: "10 في كل اتجاه"}}
      - {id: ex_leg_swings, amount: {en: "10 each leg", ar: "10 لكل رجل"}}
      - {id: ex_bw_squat, amount: {en: "10 reps", ar: "10 عدات"}}
      - {id: ex_glute_bridge, amount: {en: "12 reps", ar: "12 عدة"}}
      - {id: ex_band_pull_apart, amount: {en: "15 reps", ar: "15 عدة"}}
      - {id: ex_hip_circles, amount: {en: "10 each way", ar: "10 في كل اتجاه"}}
  ramp_up:
    sets: [{pct: 50, reps: 8}, {pct: 75, reps: 4}]
    extra: {pct: 90, reps: 2}
    extra_from_kg: 60
    min_target_kg: 10   # lighter than this: no ramp-up sets (the mobility moves are warm-up enough)
    set_minutes: 1
  explain:
    en: "Warm-up {minutes} min: {general} min of {name}, {moves} mobility moves for today's muscles, then lighter sets of {first}."
    ar: "تسخين {minutes} دقيقة: {general} دقايق {name}، و{moves} حركات مرونة لعضلات النهارده، وبعدين مجموعات أخف من {first}."
    no_ramp:
      en: "Warm-up {minutes} min: {general} min of {name} and {moves} mobility moves for today's muscles."
      ar: "تسخين {minutes} دقيقة: {general} دقايق {name} و{moves} حركات مرونة لعضلات النهارده."
    # Moves an injury rules out: a painful movement (its phrase), a restriction (its name), or a paused area.
    skipped:
      en: "Not in your warm-up: {name}. It involves {why}, which hurts your {area}."
      ar: "{name} اتشال من التسخين: فيه {why}، اللي بيوجع {area}."
    skipped_restriction:
      en: "Not in your warm-up: {name}. It goes against the \"{why}\" restriction for your {area}."
      ar: "{name} اتشال من التسخين عشان قيد «{why}» على {area}."
    skipped_paused:
      en: "Not in your warm-up: {name}, until your {area} has been checked."
      ar: "{name} اتشال من التسخين لحد ما تكشف على {area}."

# ── Cool-down (about 5–8 min, after every session) ───────────────────
# Static stretches for the muscles trained that day: the stretches whose muscles had the most sets come first.
# Big muscles (thighs, hips) are held longer; one-sided stretches count both sides. Then slow breathing.
cooldown:
  placeholder: true
  source: "PLACEHOLDER: cool-down stretching; book + page to be added"
  uses: [injuries]
  summary:
    en: 'After every session: 4–5 static stretches for the muscles trained that day, 30–45 seconds each, then a minute of slow breathing.'
    ar: 'بعد كل تمرينة: ٤–٥ إطالات ثابتة للعضلات اللي اتمرنت، ٣٠–٤٥ ثانية لكل واحدة، وبعدين دقيقة تنفس بطيء.'
  stretches: {min: 4, max: 5}
  hold_sec: 30
  hold_sec_large: 45
  large_regions: [thighL, thighR, hipL, hipR]
  each_side: [ex_chest_stretch, ex_lat_stretch, ex_triceps_stretch, ex_cross_shoulder_stretch, ex_quad_stretch, ex_hamstring_stretch,
              ex_hip_flexor_stretch, ex_glute_stretch, ex_calf_stretch]
  candidates: [ex_chest_stretch, ex_lat_stretch, ex_upper_back_stretch, ex_cross_shoulder_stretch, ex_triceps_stretch, ex_biceps_stretch,
               ex_quad_stretch, ex_hamstring_stretch, ex_hip_flexor_stretch, ex_glute_stretch, ex_calf_stretch, ex_childs_pose]
  fallback: [ex_childs_pose, ex_upper_back_stretch, ex_hamstring_stretch, ex_quad_stretch, ex_cross_shoulder_stretch]
  breathing: {id: ex_slow_breathing, minutes: 1}
  explain:
    en: "Cool-down {minutes} min: {stretches} stretches for the muscles you trained, held {hold} seconds each, then slow breathing."
    ar: "تهدئة {minutes} دقيقة: {stretches} إطالات للعضلات اللي اتمرنت، كل واحدة {hold} ثانية، وبعدين تنفّس بطيء."

# ── Cardio (the weekly plan) ─────────────────────────────────────────
# Sessions and minutes by goal ([low, high]): beginners take the low end, advanced the high end (minutes: intermediate
# in between). The type is the first option for where they train that every injury allows; injured legs prefer
# cycling and never jumping or running; the health flag means easy intensity and no jumping.
# Placement: rest days first, then after lifting; never on the day before a leg day. backend/app/engine/cardio.py
# Calories: the activity level (nutrition.yaml) already counts training days and this cardio; it's never added twice.
cardio:
  placeholder: true
  source: "PLACEHOLDER: cardio by goal; the recomposition guide covers cardio, values to be extracted"
  uses: [goal, experience, location, health, injuries]
  summary:
    en: Cardio by goal (fat loss 2–3 easy sessions plus a daily step target; muscle or strength 1–2 short ones; recomposition about 2), chosen for your equipment and injuries, on rest days or after lifting, never the day before a leg day.
    ar: كارديو حسب الهدف (خسارة دهون ٢–٣ جلسات سهلة وهدف خطوات يومي؛ عضل أو قوة ١–٢ قصيرين؛ إعادة تشكيل حوالي ٢)، متختار حسب أدواتك وإصاباتك، في أيام الراحة أو بعد الحديد، وأبدًا مش اليوم اللي قبل يوم رجل.
  by_goal:
    loseFat: {sessions: [2, 3], minutes: [20, 30], intensity: easy, steps: 8000}
    recomp: {sessions: [2, 2], minutes: [20, 25], intensity: easy, steps: 7500}
    buildMuscle: {sessions: [1, 2], minutes: [15, 20], intensity: moderate, steps: 7000}
    strength: {sessions: [1, 2], minutes: [15, 20], intensity: moderate, steps: 7000}
  options_by_location:
    gym: [ex_incline_walk, ex_bike, ex_elliptical, ex_brisk_walk]
    homeDumbbells: [ex_brisk_walk, ex_jump_rope, ex_march_in_place]
    bodyweight: [ex_brisk_walk, ex_jump_rope, ex_march_in_place]
  leg_regions: [kneeL, kneeR, ankleL, ankleR, shinL, shinR, hipL, hipR]
  leg_injury_prefer: [cycling, walking]
  leg_injury_avoid: [jump, locomotion]
  conservative_avoid: [jump]
  leg_day_kinds: [lower, full]
  intensity_names:
    easy: {en: "easy, talking pace", ar: "سهل، تقدر تتكلم"}
    moderate: {en: "moderate, a little out of breath", ar: "متوسط، نفسك عالي شوية"}
  explain:
    plan:
      en: "Cardio: {sessions} × {minutes} min of {name} ({intensity}) a week, plus about {steps} steps a day, for your goal ({goal})."
      ar: "كارديو: {sessions} × {minutes} دقيقة {name} ({intensity}) في الأسبوع، وحوالي {steps} خطوة في اليوم، عشان هدفك ({goal})."
    legs:
      en: "{name} rather than running or jumping, to spare your {area}."
      ar: "{name} بدل الجري أو النط، عشان {area}."
    conservative:
      en: "Easy intensity only, because of your health answers."
      ar: "مجهود سهل بس، بسبب إجاباتك عن الصحة."
    placement:
      en: "On rest days or after lifting, never the day before a leg day, so your legs are fresh."
      ar: "في أيام الراحة أو بعد الحديد، ومش في اليوم اللي قبل يوم الرجل، عشان رجلك تبقى مرتاحة."
    fewer:
      en: "{planned} cardio sessions fit your week instead of {wanted}: the other days are before a leg day."
      ar: "{planned} جلسات كارديو مناسبة لأسبوعك بدل {wanted}: باقي الأيام قبل يوم رجل."

# ── Swapping an exercise (the person's choice, from the session or the logger) ──
# Alternatives: same movement pattern first (then the same muscles), that fit the equipment and every active injury.
# "From now on" swaps are kept by every new plan version (weekly review, regenerate), and the exercise taken out is
# never put back. "Equipment not available" also saves that equipment as missing. backend/app/engine/training.py
swaps:
  placeholder: true
  source: "PLACEHOLDER: exercise substitution rules; to be checked against the Jeff Nippard programs' substitution lists"
  uses: [swaps]
  summary:
    en: An exercise you swapped is replaced by one with the same movement and muscles that fits your equipment and injuries, and the weekly review never puts the old one back.
    ar: التمرين اللي بدّلته بيتحط مكانه تمرين بنفس الحركة والعضلات ومناسب لأدواتك وإصاباتك، والمراجعة الأسبوعية عمرها ما ترجّع القديم.
  max_alternatives: 4
  explain:
    en: "{from} → {to}: your choice ({why})."
    ar: "{from} ← {to}: اختيارك ({why})."
  reasons:
    equipment: {en: "no {equipment}", ar: "مفيش {equipment}"}
    busy: {en: "machine busy", ar: "الجهاز مشغول"}
