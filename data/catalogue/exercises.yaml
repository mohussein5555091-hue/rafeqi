    name:
      en: Band pull-apart
      ar: فتح استك
    kind: easier
  source: 'PLACEHOLDER: sample exercise; real entries come from the Jeff Nippard programs next session'
- id: ex_pushdown
  type: strength
  name:
    en: Cable triceps pushdown
    ar: ترايسبس بالكابل
  description:
    en: Push a cable bar down with your elbows pinned to your sides. Isolates the triceps at the back of the arm.
    ar: ادفع بار الكابل لتحت والكوع لازق في جنبك. بيركّز على الترايسبس في ضهر الدراع.
  movement_pattern: elbowExtension
  joints_loaded:
  - elbow
  range_of_motion: full
  equipment:
