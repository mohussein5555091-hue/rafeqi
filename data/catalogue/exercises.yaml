- id: ex_incline_curl
  name:
    en: Incline dumbbell curl
    ar: بايسبس دمبل على بنش مائل
  description:
    en: A biceps curl lying back on an incline bench, which stretches the biceps for more work per rep.
    ar: بايسبس وأنت مسنود على بنش مائل، وده بيمدّ البايسبس فكل عدّة بتشتغل أكتر.
  movement_pattern: elbowFlexion
  joints_loaded:
  - elbow
  range_of_motion: full
  equipment:
  - dumbbells
  - bench
  difficulty: beginner
  primary_muscles:
  - armL
  - armR
  secondary_muscles:
  - forearmL
  - forearmR
  muscle_names:
    en: Biceps · forearms
    ar: البايسبس · الساعد
  instructions:
  - en: Set a bench to 45° and sit back, a dumbbell in each hand, arms hanging straight down.
    ar: اظبط البنش على 45 درجة واسند ظهرك، ودمبل في كل إيد ودراعك متدلّي.
  - en: Curl both dumbbells up, palms facing up.
    ar: ارفع الدمبلين لفوق وكفوفك لفوق.
  - en: Squeeze your biceps at the top.
    ar: اعصر البايسبس فوق.
  - en: Lower slowly until your arms are fully straight.
    ar: نزّل ببطء لحد ما دراعك يفرد خالص.
  cues:
  - en: Keep upper arms still
    ar: الدراع من فوق ثابت
  - en: Head and back stay on the bench
    ar: راسك وظهرك على البنش
  - en: Lower for 2–3 seconds
    ar: نزّل في 2–3 ثواني
  mistakes:
  - en: Swinging the weights
    ar: مرجحة الأوزان
  - en: Bringing the elbows forward at the top
    ar: تقديم الكوع لقدام فوق
  - en: Stopping short of a full stretch
    ar: ماتفردش دراعك للآخر تحت
