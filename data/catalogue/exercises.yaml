    ar: اقف قدام كابل عالي فيه بار، إيديك بعرض كتفك والكوع جنبك.
  - en: Push the bar down until your arms are straight.
    ar: ادفع البار لتحت لحد ما دراعك يفرد.
  - en: Squeeze your triceps for a second at the bottom.
    ar: اعصر الترايسبس ثانية تحت.
  - en: Let the bar rise slowly to chest height.
    ar: سيب البار يطلع ببطء لحد صدرك.
  cues:
  - en: Elbows stay still
    ar: الكوع ثابت
  - en: Slight forward lean from the hips
    ar: ميل بسيط لقدام من الوسط
  - en: Wrists straight
    ar: الرسغ مفرود
  - en: Full lockout every rep
    ar: افرد دراعك على الآخر كل عدّة
  mistakes:
  - en: Leaning over the bar
    ar: الميل على البار
