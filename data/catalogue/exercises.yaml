exercises:
- id: ex_db_floor_press
  name:
    en: Neutral-grip dumbbell floor press
    ar: ضغط دمبل من الأرض بقبضة محايدة
  description:
    en: A chest press lying on the floor. The floor limits the range, which is kinder to sore shoulders. Trains chest and triceps.
    ar: ضغط صدر وأنت نايم على الأرض. الأرض بتحدّ المدى، وده أريح للكتف. بيشتغل على الصدر والترايسبس.
  movement_pattern: horizontalPush
  joints_loaded:
  - shoulder
  - elbow
  range_of_motion: partial
  equipment:
  - dumbbells
  difficulty: beginner
  primary_muscles:
  - chest
  secondary_muscles:
  - armL
  - armR
  - shoulderL
  - shoulderR
  muscle_names:
    en: Chest · triceps, front shoulders
    ar: الصدر · الترايسبس، مقدمة الكتف
  instructions:
  - en: Lie on the floor, knees bent, a dumbbell in each hand with palms facing each other.
    ar: نام على الأرض وركبك مثنية، ودمبل في كل إيد وكفوفك في وش بعض.
  - en: Lower until your upper arms touch the floor.
    ar: نزّل لحد ما دراعك يلمس الأرض.
  - en: Press up until your arms are straight.
    ar: ادفع لفوق لحد ما دراعك يفرد.
  cues:
  - en: Elbows about 45° from your body
    ar: الكوع حوالي 45 درجة من جسمك
  - en: Pause lightly on the floor
    ar: وقفة خفيفة على الأرض
  - en: Breathe out as you press
    ar: اطرد النفس وأنت بتدفع
  mistakes:
  - en: Bouncing the elbows off the floor
    ar: خبط الكوع في الأرض
  - en: Flaring the elbows out wide
    ar: فتح الكوع لبرّه أوي
  image_url: /exercises/Dumbbell_Floor_Press/0.jpg
  image_frames:
  - /exercises/Dumbbell_Floor_Press/1.jpg
  video_url: https://www.youtube.com/results?search_query=Neutral+grip+dumbbell+floor+press+proper+form
  media_source:
    name: Free Exercise DB
    url: https://github.com/yuhonas/free-exercise-db/tree/main/exercises/Dumbbell_Floor_Press
    license: Unlicense (public domain)
  alternatives:
  - name:
      en: Incline push-up on a bench
      ar: ضغط مائل على بنش
    kind: easier
  - name:
      en: Machine chest press, neutral grip
      ar: ضغط صدر على الجهاز بقبضة محايدة
    kind: injuryFriendly
  source: 'PLACEHOLDER: sample exercise; real entries come from the Jeff Nippard programs next session'
- id: ex_cs_row
  name:
    en: Chest-supported dumbbell row
    ar: تجديف دمبل بسند للصدر
  description:
    en: A row lying face-down on an incline bench, so your lower back rests while your upper back works.
    ar: تجديف وأنت نايم على بطنك على بنش مائل، فأسفل ظهرك مرتاح وأعلى ظهرك هو اللي بيشتغل.
  movement_pattern: horizontalPull
  joints_loaded:
  - shoulder
  - elbow
  range_of_motion: full
  equipment:
  - dumbbells
  - bench
  difficulty: beginner
  primary_muscles:
  - upperBack
  secondary_muscles:
  - armL
  - armR
  muscle_names:
    en: Upper back · biceps
    ar: أعلى الظهر · البايسبس
  instructions:
  - en: Set a bench to about 30–45° and lie chest-down, a dumbbell in each hand, arms hanging straight.
    ar: اظبط البنش على 30–45 درجة ونام على بطنك، ودمبل في كل إيد ودراعك متدلّي.
  - en: Pull the dumbbells up and back towards your hips.
    ar: اسحب الدمبل لفوق ولورا ناحية وسطك.
  - en: Pause for a second with your shoulder blades squeezed.
    ar: اثبت ثانية ولوحي الكتف مضغوطين.
  - en: Lower slowly until your arms are straight again.
    ar: نزّل ببطء لحد ما دراعك يفرد تاني.
  cues:
  - en: Lead with your elbows
    ar: الكوع هو اللي يقود الحركة
  - en: Squeeze shoulder blades together
    ar: اضغط لوحي الكتف على بعض
  - en: Keep your chest on the bench
    ar: صدرك لازق في البنش
  - en: Look down, neck long
    ar: بصّ لتحت، ورقبتك مفرودة
  mistakes:
  - en: Shrugging to your ears
    ar: رفع الكتف ناحية الودن
  - en: Lifting the chest off the bench to swing the weight
    ar: رفع صدرك من على البنش عشان تمرجح الوزن
  - en: Cutting the range short at the bottom
    ar: تقصير المدى من تحت
  image_url: /exercises/Dumbbell_Incline_Row/0.jpg
  image_frames:
  - /exercises/Dumbbell_Incline_Row/1.jpg
  video_url: https://www.youtube.com/results?search_query=Chest+supported+dumbbell+row+proper+form
  media_source:
    name: Free Exercise DB
    url: https://github.com/yuhonas/free-exercise-db/tree/main/exercises/Dumbbell_Incline_Row
    license: Unlicense (public domain)
  alternatives:
  - name:
      en: Seated cable row
      ar: تجديف بالكابل قاعد
    kind: easier
  source: 'PLACEHOLDER: sample exercise; real entries come from the Jeff Nippard programs next session'
- id: ex_landmine_press
  name:
    en: Half-kneeling landmine press
    ar: ضغط لاندماين على ركبة واحدة
  description:
    en: A one-arm press at an angle using a bar anchored in a corner. Trains the shoulders without pressing straight overhead.
    ar: ضغط بإيد واحدة بزاوية ببار متثبّت في الركن. بيشتغل على الكتف من غير رفع فوق الراس على طول.
  movement_pattern: verticalPush
  joints_loaded:
  - shoulder
  - elbow
  range_of_motion: partial
  equipment:
  - landmine
  - barbell
  difficulty: intermediate
  primary_muscles:
  - shoulderL
  - shoulderR
  secondary_muscles:
  - chest
  - armL
  - armR
  - abdomen
  muscle_names:
    en: Front shoulders · upper chest, triceps, core
    ar: مقدمة الكتف · أعلى الصدر، الترايسبس، البطن
  instructions:
  - en: Kneel on your right knee, left foot forward, bar end in your left hand at shoulder height.
    ar: انزل على ركبتك اليمين، ورجلك الشمال قدام، وطرف البار في إيدك الشمال عند الكتف.
  - en: Brace your stomach and squeeze your right glute.
    ar: شدّ بطنك واعصر عضلة المقعدة اليمين.
  - en: Press the bar up and forward until your arm is long — not straight overhead.
    ar: ادفع البار لفوق ولقدام لحد ما دراعك يفرد — مش فوق راسك على طول.
  - en: Lower for 2 seconds back to your shoulder.
    ar: نزّله في ثانيتين لحد كتفك.
  cues:
  - en: Ribs down — don't lean back
    ar: الضلوع لتحت — ماترجعش لورا
  - en: Reach "up and out", like pushing a door shut
    ar: ادفع لفوق ولقدام، كأنك بتقفل باب
  - en: Keep your wrist stacked over your elbow
    ar: خلّي رسغك فوق كوعك
  - en: Breathe out as you press
    ar: اطرد النفس وأنت بتدفع
  mistakes:
  - en: Arching the lower back to finish the rep
    ar: تقويس أسفل الظهر عشان تكمّل العدّة
  - en: Shrugging the shoulder up to your ear
    ar: رفع الكتف ناحية الودن
  - en: Dropping the bar fast on the way down
    ar: تنزيل البار بسرعة
  image_url: /exercises/Single-Arm_Linear_Jammer/0.jpg
  image_frames:
  - /exercises/Single-Arm_Linear_Jammer/1.jpg
  video_url: https://www.youtube.com/results?search_query=Half+kneeling+landmine+press+proper+form
  media_source:
    name: Free Exercise DB
    url: https://github.com/yuhonas/free-exercise-db/tree/main/exercises/Single-Arm_Linear_Jammer
    license: Unlicense (public domain)
    note:
      en: 'Closest match in the image library: standing version. Yours is half-kneeling.'
      ar: 'أقرب صورة متاحة: النسخة وأنت واقف. تمرينك على ركبة واحدة.'
  alternatives:
  - name:
      en: Incline push-up on a bench
      ar: ضغط مائل على بنش
    kind: easier
  - name:
      en: Single-arm cable press
      ar: ضغط كابل بإيد واحدة
    kind: injuryFriendly
  - name:
      en: Seated landmine press
      ar: ضغط لاندماين وأنت قاعد
    kind: easier
  source: 'PLACEHOLDER: sample exercise; real entries come from the Jeff Nippard programs next session'
- id: ex_lat_pulldown
  name:
    en: Neutral-grip lat pulldown
    ar: سحب علوي بقبضة محايدة
  description:
    en: Pull a bar down to your chest while seated, palms facing each other. Builds the wide back muscles (lats) and biceps.
    ar: اسحب مسكة لحد صدرك وأنت قاعد، وكفوفك في وش بعض. بيبني عضلات الظهر العريضة والبايسبس.
  movement_pattern: verticalPull
  joints_loaded:
  - shoulder
  - elbow
  range_of_motion: full
  equipment:
  - cable
  difficulty: beginner
  primary_muscles:
  - upperBack
  secondary_muscles:
  - armL
  - armR
  muscle_names:
    en: Lats · biceps
    ar: عضلات الظهر الجانبية · البايسبس
  instructions:
  - en: Sit with your thighs locked under the pad and hold the neutral handle, palms facing each other.
    ar: اقعد ورجلك مثبّتة تحت المسند، وامسك المسكة المحايدة وكفوفك في وش بعض.
  - en: Lean back very slightly and lift your chest.
    ar: ارجع لورا سنّة صغيرة وارفع صدرك.
  - en: Pull the handle to your upper chest, driving your elbows down.
    ar: اسحب المسكة لأعلى صدرك وانت بتنزّل كوعك لتحت.
  - en: Let it rise slowly until your arms are straight.
    ar: سيبها تطلع ببطء لحد ما دراعك يفرد.
  cues:
  - en: Chest up to the handle
    ar: صدرك يطلع للمسكة
  - en: Elbows down to your back pockets
    ar: الكوع ينزل ناحية جيوبك اللي ورا
  - en: Shoulders away from your ears
    ar: الكتف بعيد عن ودانك
  - en: Control the way up
    ar: اتحكّم في الطلعة
  mistakes:
  - en: Leaning far back
    ar: الرجوع لورا كتير
  - en: Pulling with the arms only
    ar: السحب بالدراع بس
  - en: Letting the weight yank you up
    ar: تسيب الوزن يشدّك لفوق فجأة
  image_url: /exercises/V-Bar_Pulldown/0.jpg
  image_frames:
  - /exercises/V-Bar_Pulldown/1.jpg
  video_url: https://www.youtube.com/results?search_query=Neutral+grip+lat+pulldown+proper+form
  media_source:
    name: Free Exercise DB
    url: https://github.com/yuhonas/free-exercise-db/tree/main/exercises/V-Bar_Pulldown
    license: Unlicense (public domain)
  alternatives:
