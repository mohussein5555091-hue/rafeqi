- id: ex_split_squat
  name:
    en: Dumbbell split squat
    ar: سبليت سكوات بالدمبل
  description:
    en: A staggered-stance squat with a dumbbell in each hand, one leg at a time. Trains thighs and glutes and evens out left and right.
    ar: سكوات ورجل قدام ورجل ورا ودمبل في كل إيد، رجل رجل. بيشتغل على الفخد والمؤخرة وبيعادل بين الشمال واليمين.
  movement_pattern: lunge
  joints_loaded:
  - knee
  - hip
  range_of_motion: full
  equipment:
  - dumbbells
  difficulty: intermediate
  primary_muscles:
  - thighL
  - thighR
  - hipL
  - hipR
  secondary_muscles: []
  muscle_names:
    en: Front thighs, glutes
    ar: الفخد الأمامية، المؤخرة
  instructions:
  - en: Take a long step forward, a dumbbell in each hand, back heel off the floor.
    ar: خد خطوة طويلة لقدام، ودمبل في كل إيد، وكعب الرجل اللي ورا مرفوع.
  - en: Lower straight down until your back knee nearly touches the floor.
    ar: انزل على طول لتحت لحد ما ركبة الرجل اللي ورا تقرب من الأرض.
  - en: Push through your front foot to come back up.
    ar: ادفع برجلك اللي قدام عشان تطلع.
