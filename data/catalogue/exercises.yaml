      en: Half-kneeling single-arm cable pulldown
      ar: سحب كابل بإيد واحدة على ركبة
    kind: injuryFriendly
  source: 'PLACEHOLDER: sample exercise; real entries come from the Jeff Nippard programs next session'
- id: ex_face_pull
  name:
    en: Cable face pull
    ar: سحب للوجه بالكابل
  description:
    en: Pull a rope towards your face on a cable machine. Strengthens the rear shoulders and upper back, which helps shoulder health.
    ar: اسحب حبل ناحية وشك على جهاز الكابل. بيقوّي خلفية الكتف وأعلى الظهر، وده مفيد لصحة الكتف.
  movement_pattern: shoulderExternalRotation
  joints_loaded:
  - shoulder
  range_of_motion: full
  equipment:
  - cable
  difficulty: beginner
  primary_muscles:
  - shoulderL
  - shoulderR
  secondary_muscles:
  - upperBack
  muscle_names:
    en: Rear shoulders · upper back
    ar: خلفية الكتف · أعلى الظهر
  instructions:
  - en: Set a rope on a cable at face height and hold it with thumbs pointing back towards you.
    ar: ثبّت الحبل في الكابل على مستوى وشك وامسكه والإبهام ناحيتك.
  - en: Step back until your arms are straight, feet shoulder-width apart.
    ar: ارجع لورا لحد ما دراعك يفرد، ورجليك بعرض كتفك.
  - en: Pull the rope towards your forehead, separating your hands as it comes in.
    ar: اسحب الحبل ناحية جبهتك وافتح إيديك وهو جاي.
  - en: Hold one second, then return slowly.
    ar: اثبت ثانية، ورجّع ببطء.
  cues:
  - en: Thumbs point back at the end
    ar: الإبهام يشاور لورا في الآخر
  - en: Elbows high, level with your hands
    ar: الكوع عالي، على مستوى إيدك
  - en: Squeeze the back of your shoulders
    ar: اعصر خلفية الكتف
  - en: Stand tall, no leaning
    ar: اقف مفرود من غير ميل
  mistakes:
  - en: Using too much weight
    ar: وزن تقيل زيادة
  - en: Leaning back to pull
    ar: الميل لورا عشان تسحب
  - en: Letting the elbows drop low
    ar: نزول الكوع لتحت
  image_url: /exercises/Face_Pull/0.jpg
  image_frames:
  - /exercises/Face_Pull/1.jpg
  video_url: https://www.youtube.com/results?search_query=Cable+face+pull+proper+form
