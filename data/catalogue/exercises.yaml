- id: ex_goblet_squat
  type: strength
  name:
    en: Goblet squat
    ar: سكوات جوبلت
  description:
    en: A squat holding one dumbbell at your chest. The weight in front keeps you upright, so it is easy to learn. Trains thighs and glutes.
    ar: سكوات وأنت شايل دمبل واحد قدام صدرك. الوزن من قدام بيخليك واقف مفرود، فسهل تتعلمه. بيشتغل على الفخد والمؤخرة.
  movement_pattern: squat
  joints_loaded:
  - knee
  - hip
  - spine
  range_of_motion: full
  equipment:
  - dumbbells
  difficulty: beginner
  primary_muscles:
  - thighL
  - thighR
  secondary_muscles:
  - hipL
  - hipR
  muscle_names:
    en: Front thighs, glutes · inner thighs
    ar: الفخد الأمامية، المؤخرة · الفخد الداخلية
  instructions:
  - en: Hold one dumbbell upright against your chest with both hands, feet a little wider than your hips.
    ar: امسك دمبل واحد واقف على صدرك بإيديك الاتنين، ورجليك أوسع شوية من وسطك.
  - en: Sit down between your heels, keeping your chest up.
    ar: انزل كأنك بتقعد بين كعوبك، وصدرك لفوق.
  - en: Go as low as you can with a flat back.
    ar: انزل لأوطى نقطة تقدر عليها وضهرك مفرود.
  - en: Push the floor away to stand back up.
    ar: ادفع الأرض بقوة عشان تقوم.
  cues:
  - en: Knees follow your toes
    ar: الركبة في اتجاه صوابع رجلك
  - en: Whole foot on the floor
    ar: رجلك كلها على الأرض
  - en: Elbows inside the knees at the bottom
    ar: الكوع جوه الركبة تحت
  mistakes:
  - en: Heels lifting off the floor
    ar: الكعب يترفع من الأرض
  - en: Knees caving inwards
    ar: الركبة تدخل لجوه
  - en: Rounding the lower back at the bottom
    ar: تقويس أسفل الضهر تحت
