# Foods, nutrition per 100 g (as eaten: cooked rice, cooked lentils…). Loaded by `npm run db:seed`.
# tags: matched against the questionnaire's dislikes (liver, eggplant, okra, fish, mushrooms, lentils, beef, dairy)
#       and allergies (nuts, lactose, gluten, eggs, shellfish, sesame).
# role: what the food does in a meal: protein (meat, chicken, fish), eggsDairy (eggs, cheese, yogurt), legume, carb, fat,
#       vegetable, fruit or flavour. When someone removes an ingredient, the replacements offered have the same role
#       (eggs → cheese or yogurt; chicken → fish or beef), never anything else. Flavours have no replacement.
# grocery: which generic shop item covers this food, and how many grams of that item one gram of food needs
#          (cooked rice → dry rice ≈ 0.4; a grilled chicken breast loses water, so 1 g cooked ≈ 1.35 g raw).
# PLACEHOLDER values: approximate, from USDA FoodData Central. Replace with the Egyptian food composition
# table / the recipe book next session.
